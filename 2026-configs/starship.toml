# ═══════════════════════════════════════════════════════════════════
#  Starship — installs to ~/.config/starship.toml
#  Docs: https://starship.rs/config/
#
#  Layout is three lines, on purpose:
#    1. time · directory · git · jobs · duration
#    2. everything else (language/tool versions, cloud, container…)
#    3. the prompt character
#
#  Debugging:
#    starship print-config    # active config INCLUDING defaults
#    starship explain         # why is segment X showing?
#    starship timings         # what's slow?
#    starship module nodejs   # render one module in isolation
# ═══════════════════════════════════════════════════════════════════

# Editor autocomplete + inline validation for this file.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# ── Layout ─────────────────────────────────────────────────────────
# $all = every module NOT named explicitly above, in Starship's
# default order. This replaces the ~50-module list you had enumerated
# by hand, and means new modules appear automatically instead of
# silently never rendering. (Your old list predated bun, git_metrics,
# os, container, direnv, mise, and ~35 others.)
#
# TRADEOFF: line 2 now uses Starship's default ordering, so
# docker_context comes before nodejs rather than after. If you want
# the old order back, see the commented block at the bottom.
format = """
$time\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$jobs\
$cmd_duration\
\n\
$all
$character"""

# https://starship.rs/config/#line-break
# REQUIRED when using $all with manual \n line breaks: $all includes
# $line_break, which would inject an extra newline mid-line-2 and
# strand whatever follows it (battery, container, os) on its own line.
[line_break]
disabled = true

# ── Line 1 ─────────────────────────────────────────────────────────

# https://starship.rs/config/#time
# Disabled by default, so the explicit enable is required.
#
# time_format is set explicitly rather than relying on use_12hr,
# because %r changed between Starship versions: 1.16 renders
# "09:56:33 PM", 1.26 renders "9:56:33 PM" (no zero-padding).
# %I is zero-padded 12-hour, so this looks identical on both.
# Verified by rendering on 1.16.0 and 1.26.0.
[time]
disabled = false
time_format = "%I:%M:%S %p"
format = '[$time]($style) '

# https://starship.rs/config/#directory
# truncation_length 3 and truncate_to_repo true are ALREADY the
# defaults — nothing to set. Kept as a comment so you know where to
# look, without pretending it's a customization.
# [directory]
# truncation_length = 3

# https://starship.rs/config/#git-branch
# RESTORED from starship.toml.old: nf-oct-git_branch = U+F418.
# Starship's default is nf-pl-branch (U+E0A0), the taller Powerline
# glyph — this was a real customization, not a redundant one.
# Still valid in Nerd Fonts v3.
[git_branch]
symbol = "\uf418 "

# https://starship.rs/config/#command-duration
[cmd_duration]
min_time = 500

# https://starship.rs/config/#jobs
[jobs]
threshold = 1

# ── Line 2 ─────────────────────────────────────────────────────────

# https://starship.rs/config/#node-js
# Glyphs are TOML escapes, NOT literal characters. Basic
# (double-quoted) strings process \u / \U; literal (single-quoted)
# strings do NOT — the quote style is load-bearing.
#
# Your original was U+F898, an OLD Material Design Icons codepoint.
# Nerd Fonts v3 dropped the entire F500-FD46 block, so U+F898 no
# longer exists in your font and cannot be restored as-is.
# The v3 equivalent is U+F0399 (nf-md-nodejs), confirmed by the
# documented remap: F898 - F500 = 0x398; F0001 + 0x398 = F0399.
# Note the 8-digit \U form — \u only takes 4 hex digits.
#
# Currently set to nf-dev-nodejs_small (U+E718). To go back to the
# modern version of your original MDI icon, swap the commented line.
[nodejs]
format = "[\ue718 $version](bold green) "
# format = "[\U000f0399 $version](bold green) "

# https://starship.rs/config/#docker-context
# Fixed: your version had a leading AND trailing space, which is
# where the double gap in your prompt came from.
#
# On Starship 1.26 the module suppresses `default` and `desktop-linux`
# unconditionally — verified by rendering. So the `desktop-linux` you
# were seeing came from an older Starship, and will disappear on its
# own once you're current. It renders only for real remote contexts:
#   DOCKER_CONTEXT=my-remote-cluster  ->   my-remote-cluster
# It also needs a Dockerfile/compose file present (only_with_files).
#
# nf-linux-docker = U+F308 (the whale). Alternative: nf-dev-docker
# = U+E7B0. Search any glyph at nerdfonts.com/cheat-sheet.
[docker_context]
format = "[\uf308 $context](blue bold) "

# ── Line 3 ─────────────────────────────────────────────────────────

# https://starship.rs/config/#character
# Defaults are already ❯ green / ❯ red. Uncomment to change SHAPE on
# error rather than only color.
# [character]
# success_symbol = '[❯](bold green)'
# error_symbol = '[✗](bold red)'

# ── Removed, and why ───────────────────────────────────────────────
#
# $status + [status]  The status module is DISABLED BY DEFAULT. You
#                     had it in the format string with an empty
#                     [status] table, so it never rendered. If you
#                     want exit codes, add:
#                       [status]
#                       disabled = false
#                       map_symbol = true
#                     ...and put $status back in the format above.
#
# $line_break         You had it in the format while also setting
#                     [line_break] disabled = true. Dead entry. The
#                     literal newlines in `format` do the work.
#
# [git_state]         Empty tables — they configured nothing. The doc
# [git_status]        URLs above serve the same "where do I look"
# [line_break]        purpose without looking like settings.

# ── If you want the old line-2 ordering back ───────────────────────
# Replace $all in `format` with an explicit list. You'll be back to
# maintaining it by hand as Starship adds modules:
#
# $nodejs\
# $docker_context\
# $package\
# $python\
# $golang\
# ... etc
